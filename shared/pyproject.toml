[project]
name = "little-roots-shared"
version = "0.1.0"
description = "Shared _script_payload schema and transliterate() interface for Little Roots services"
requires-python = ">=3.9"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["script_payload", "transliterate_interface"]
